<!doctype html><meta charset="utf-8"><img id="src" src="img/mouse_run_sheet.png"><pre id="out"></pre><script>
const img=document.getElementById('src'); img.onload=()=>{
 const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;const x=c.getContext('2d');x.drawImage(img,0,0);
 const before=x.getImageData(150,100,1,1).data;
 x.globalCompositeOperation='color';x.fillStyle='hsl(185, 78%, 50%)';x.fillRect(0,0,c.width,c.height);x.globalCompositeOperation='source-over';
 const after=x.getImageData(150,100,1,1).data;
 document.getElementById('out').textContent=JSON.stringify({before:Array.from(before),after:Array.from(after),changed:before.some((v,i)=>v!==after[i])});
};
</script>
